[versions]
agp = "9.0.1"
# Stage 4-2（2026-10-01）androidx 拉平：以下均为 2026-10 检索到的最新稳定版（无 alpha/beta/rc），
# 与 compileSdk 36 / minSdk 24 兼容；仅拉平这五项，onnxruntime/opencv/coroutines 不动。
coreKtx = "1.17.0"          # 2026-10-01：core 稳定线 1.16.0→1.17.0（2025 稳定发布），compileSdk 36 可用
junit = "4.13.2"
appcompat = "1.7.1"         # 2026-10-01：1.7.0（2025-05 稳定）+ 1.7.1 补丁；1.8 仍在 rc，故取 1.7.1
material = "1.14.0"         # 2026-10-01：material components 2026 年最新稳定线 1.14.0
activity = "1.11.0"         # 2026-10-01：1.10.x 之后 1.11.0 已转稳定（其后才是 1.12.0-alpha01）
constraintlayout = "2.2.1"  # 2026-10-01：2.2.0（2024 末稳定）的 bugfix 版 2.2.1，无更新稳定线
kotlin = "2.0.21"
opencv = "4.10.0"
opencvDesktop = "4.9.0-0"
coroutines = "1.9.0"
onnxruntime = "1.30.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
opencv = { group = "org.opencv", name = "opencv", version.ref = "opencv" }
opencv-desktop = { group = "org.openpnp", name = "opencv", version.ref = "opencvDesktop" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
# JVM 版供本地单测跑真实推理对拍（Android 主包仍用 onnxruntime-android）
onnxruntime-jvm = { group = "com.microsoft.onnxruntime", name = "onnxruntime", version.ref = "onnxruntime" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
